<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../assets/shared.css">
<link rel="stylesheet" href="../layout.html">
<title>핸드오프 — 관리자</title>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="sidebar"></aside>
  <main class="app-main">
<div class="main-head">
  <div>
    <h2 id="member-name">팀원 이름</h2>
    <p id="member-title">직책</p>
  </div>
  <button class="btn btn-secondary">권한 변경</button>
</div>

<div class="member-detail-container">
  <div class="detail-section">
    <h3>기본 정보</h3>
    <dl>
      <dt>이름</dt>
      <dd id="member-full-name">-</dd>
      <dt>이메일</dt>
      <dd id="member-email">-</dd>
      <dt>직책</dt>
      <dd id="member-position">-</dd>
      <dt>역할</dt>
      <dd id="member-role">관리자</dd>
      <dt>가입일</dt>
      <dd id="member-joined">-</dd>
    </dl>
  </div>

  <div class="detail-section">
    <h3>담당 프로젝트</h3>
    <div id="member-projects" class="project-list">
      <!-- 담당 프로젝트 목록 -->
    </div>
  </div>

  <div class="detail-section">
    <h3>권한</h3>
    <div id="member-permissions" class="permissions-list">
      <!-- 권한 목록 -->
    </div>
  </div>

  <div class="detail-section" style="border-top:2px solid var(--border);padding-top:2rem;margin-top:2rem;">
    <h3 style="color:var(--danger);">팀에서 제거</h3>
    <p style="font-size:12px;color:var(--secondary-text);margin-bottom:1rem;">이 팀원을 팀에서 제거하면 모든 프로젝트 접근이 차단돼요</p>
    <button class="btn" style="background:var(--danger);color:white;border:none;" onclick="if(confirm('정말 제거하시겠어요?')) alert('팀원이 제거되었습니다.');">제거</button>
  </div>
</div>

<script>
  fetch('../_sidebar.html')
    .then(r => r.text())
    .then(html => {
      document.getElementById('sidebar').innerHTML = html;
    });
</script>
<script>
  (function(){
    // 팀원 상세 페이지 로직
    // URL 파라미터 또는 sessionStorage에서 팀원 ID를 가져와 상세 정보 로드
  })();
  </script>
</main>
</div>
</body>
</html>
